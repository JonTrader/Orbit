# Orbit CI. Grow this file with the test plan:
#   Node 24 (npm 11) is required: npm 10 `npm ci` rejects npm-11 lockfiles
#   (see AGENTS.md CI section). Keep this in sync with local dev.
#   Phase B: done - `test` runs against repo secret DATABASE_URL_TEST (Neon ci branch)
#   Phase G: done - `e2e` runs Playwright against the same branch; the vitest
#     suite resets it and e2e seeds its own users, and the shared concurrency
#     group keeps the two from interleaving.
#   Phase J: make these required checks; document secrets in README
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    # All test jobs use the same destructive Neon branch. Serialize them
    # across refs so push and pull_request workflows cannot reset it together.
    concurrency:
      group: orbit-database-tests
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
          DATABASE_URL_TEST_CONFIRMATION: dedicated-neon-branch
          # Dummy values for modules that require config on load (lib/auth).
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: orbit-ci-test-secret-orbit-ci-test-secret

  e2e:
    runs-on: ubuntu-latest
    concurrency:
      group: orbit-database-tests
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The vitest run may have reset this branch's schema; re-apply
      # migrations so the app the tests drive has its tables.
      - run: npx drizzle-kit migrate
        env:
          DRIZZLE_DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      # Do not set DATABASE_URL here: bootstrapE2eDatabaseUrl resolves
      # DATABASE_URL_TEST (same guardrails as Vitest) and wires DATABASE_URL.
      - run: npm run test:e2e
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
          DATABASE_URL_TEST_CONFIRMATION: dedicated-neon-branch
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: orbit-ci-test-secret-orbit-ci-test-secret
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
