# Orbit CI. Grow this file with the test plan:
#   Node 24 (npm 11) is required: npm 10 `npm ci` rejects npm-11 lockfiles
#   (see AGENTS.md CI section). Keep this in sync with local dev.
#   Phase B: done - `test` runs against repo secret DATABASE_URL_TEST (Neon ci branch)
#   Phase G: done - `e2e` runs Playwright against a separate Neon branch
#     (DATABASE_URL_E2E). test and e2e use different concurrency groups so they
#     can run in parallel.
#   Phase J: make these required checks; document secrets in README
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    # Destructive Vitest suite against DATABASE_URL_TEST. Serialize across
    # refs so two vitest jobs cannot reset the same branch together.
    concurrency:
      group: orbit-database-tests
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
          DATABASE_URL_TEST_CONFIRMATION: dedicated-neon-branch
          # Dummy values for modules that require config on load (lib/auth).
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: orbit-ci-test-secret-orbit-ci-test-secret

  e2e:
    runs-on: ubuntu-latest
    # Playwright against DATABASE_URL_E2E. Separate from vitest so the two
    # jobs can run in parallel on different Neon branches.
    concurrency:
      group: orbit-e2e-database-tests
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Apply migrations to the E2E Neon branch before Playwright boots.
      - run: npx drizzle-kit migrate
        env:
          DRIZZLE_DATABASE_URL: ${{ secrets.DATABASE_URL_E2E }}
      # Do not set DATABASE_URL here: bootstrapE2eDatabaseUrl resolves
      # DATABASE_URL_E2E and wires DATABASE_URL for the app server.
      - run: npm run test:e2e
        env:
          DATABASE_URL_E2E: ${{ secrets.DATABASE_URL_E2E }}
          DATABASE_URL_E2E_CONFIRMATION: dedicated-neon-branch
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: orbit-ci-test-secret-orbit-ci-test-secret
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
