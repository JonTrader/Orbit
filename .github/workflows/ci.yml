# Orbit CI. Grow this file with the test plan:
#   Node 24 (npm 11) is required: npm 10 `npm ci` rejects npm-11 lockfiles
#   (see AGENTS.md CI section). Keep this in sync with local dev.
#   Phase B: done - `test` runs against repo secret DATABASE_URL_TEST (Neon ci branch)
#   Phase G: uncomment `e2e`
#   Phase J: make these required checks; document secrets in README
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    # All test jobs use the same destructive Neon branch. Serialize them
    # across refs so push and pull_request workflows cannot reset it together.
    concurrency:
      group: orbit-database-tests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
          DATABASE_URL_TEST_CONFIRMATION: dedicated-neon-branch

  # e2e:
